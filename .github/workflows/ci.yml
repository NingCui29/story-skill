name: Verify source and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run regression tests including historical migration
        run: python -u -B -X utf8 -m unittest discover -s tests -v
      - name: Build the complete skill ZIP
        run: python -B -X utf8 scripts/package.py
      - name: Exercise the local CLI workflow
        run: python -B -X utf8 scripts/smoke.py --output dist/ci-smoke.json
      - name: Exercise synthetic Chinese transactions
        run: python -B -X utf8 scripts/chinese_acceptance.py --output dist/ci-chinese.json
      - name: Exercise multi-line writing and historical revision
        run: python -B -X utf8 scripts/long_acceptance.py --output dist/ci-long.json
