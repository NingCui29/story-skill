name: Sync GitHub Packages
run-name: Sync ${{ inputs.tag || github.event.release.tag_name }} to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable Release tag to synchronize
        required: true
        default: v0.6.15
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: packages-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'NingCui29/story-skill'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate package tooling
        run: |
          python -B -X utf8 -m unittest discover -s tests -p 'test_package*.py'
          python -B -X utf8 -m unittest discover -s tests -p test_sync_packages.py
      - name: Verify Claude Desktop skill bundle
        run: |
          python -B -X utf8 scripts/package_claude.py --output "$RUNNER_TEMP/story-skill-claude-desktop.zip"
      - name: Publish and verify the Release payload
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python -B -X utf8 scripts/sync_packages.py --tag "$PACKAGE_TAG"
      - name: Record package association metadata
        if: always()
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python -B -X utf8 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import sync_packages as sync
          token = os.environ["NODE_AUTH_TOKEN"]
          report = {"tag": os.environ["PACKAGE_TAG"], "repository": sync.REPOSITORY}
          def selected(value, keys):
              return {key: value.get(key) for key in keys} if isinstance(value, dict) else None
          for label, url, api_version in (
              ("package", "https://api.github.com/users/NingCui29/packages/npm/story-skill", "2026-03-10"),
              ("package_legacy", "https://api.github.com/users/NingCui29/packages/npm/story-skill", "2022-11-28"),
              ("source_repository", "https://api.github.com/repos/" + sync.REPOSITORY, "2026-03-10"),
          ):
              try:
                  value = sync.read_json(url, token, "api.github.com", api_version=api_version)
                  fields = ("id", "name", "package_type", "visibility", "html_url") if label.startswith("package") else ("id", "full_name", "private")
                  item = {"http_status": 200, "api_version": api_version, "metadata": selected(value, fields)}
                  if label.startswith("package"):
                      item["repository_field_present"] = "repository" in value
                      item["repository"] = selected(value.get("repository"), ("id", "full_name", "private"))
                  report[label] = item
              except Exception as error:
                  report[label] = {"http_status": getattr(error, "code", None), "error": str(error).replace(token, "[redacted]")[:500]}
          output = Path("dist/packages-sync/package-association.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report))
          PY
      - name: Preserve synchronization receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-sync-${{ inputs.tag || github.event.release.tag_name }}
          path: |
            dist/packages-sync/receipt*.json
            dist/packages-sync/package-association.json
            dist/packages-sync/downloaded-package.tgz
          if-no-files-found: ignore
          retention-days: 14
