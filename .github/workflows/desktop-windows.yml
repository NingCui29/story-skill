name: Build Windows desktop candidate

on:
  workflow_dispatch:
    inputs:
      draft_release_id:
        description: 'Existing windows-v0.2.5 draft release ID; 0 disables all release uploads'
        required: false
        default: '0'
        type: string
  push:
    branches:
      - 'codex/desktop-installers*'
      - 'codex/windows-csharp*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Probe book management before desktop build
        shell: pwsh
        timeout-minutes: 2
        run: |
          python -I -B tests/desktop_payload_probe.py --scripts skills/story-skill/scripts --area "$env:RUNNER_TEMP\source-payload-safety" --report "$env:RUNNER_TEMP\source-runtime-safety.json"
          if ($LASTEXITCODE -ne 0) { throw "Source runtime safety probe failed" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Reject prohibited source dependencies
        run: python -B scripts/check_forbidden_technologies.py --source
      - name: Verify standard-library-only build requirements
        run: python -m pip install -r desktop/windows/requirements-build.txt
      - name: Test draft publishing safety
        run: python -B -X utf8 -m unittest discover -s tests -p test_publish_windows_draft.py -v
      - name: Test desktop launcher and Windows paths
        run: python -B -X utf8 -m unittest discover -s tests -p test_desktop*.py -v
      - name: Test book management and native recycle bridge
        run: python -B -X utf8 -m unittest discover -s tests -p test_workbench_books.py -v
      - name: Test C# desktop contracts
        run: dotnet run --project tests/windows/StoryWorkbench.Tests.csproj --configuration Release -- --report dist/windows-csharp-tests.json
      - name: Build standalone candidate
        run: python -B -X utf8 scripts/build_desktop_windows.py --output dist/story-workbench-windows-x86_64
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          & $compiler /Qp "/DAppSource=$pwd\dist\story-workbench-windows-x86_64" "/DInstallerOutput=$pwd\dist" desktop/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          & $compiler /Qp /DLifecycleFailureProbe=1 "/DAppSource=$pwd\dist\story-workbench-windows-x86_64" "/DInstallerOutput=$env:RUNNER_TEMP" desktop/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Rollback acceptance installer build failed" }
          $installer = Get-Item dist/story-workbench-*-windows-x86_64-setup.exe
          $digest = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($installer.Name)" | Set-Content -Path "$($installer.FullName).sha256" -Encoding ascii
      - name: Test installation and native window
        shell: pwsh
        run: |
          $destination = "$env:RUNNER_TEMP\安装验证 空格"
          $installer = Get-Item dist/story-workbench-*-windows-x86_64-setup.exe
          $previous = "$env:RUNNER_TEMP\story-workbench-0.2.4-windows-x86_64-setup.exe"
          Invoke-WebRequest -Uri 'https://github.com/NingCui29/story-skill/releases/download/windows-v0.2.4/story-workbench-0.2.4-windows-x86_64-setup.exe' -OutFile $previous
          if ((Get-FileHash $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne '791d7bd00774f66d704199ab52c9af5dfc2f188f068c085b02921fb62490de12') { throw 'Previous release checksum mismatch' }
          $prior = Start-Process -FilePath $previous -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
          if ($prior.ExitCode -ne 0) { throw 'Previous release installation failed' }
          $priorHash = (Get-FileHash "$destination\StoryWorkbench.exe" -Algorithm SHA256).Hash
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"", "/LOG=`"$pwd\dist\windows-install.log`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (!(Test-Path "$destination\StoryWorkbench.exe")) { throw "Installed executable missing" }
          $backup = @(Get-ChildItem -Path "$destination.previous-*" -Directory)
          if ($backup.Count -ne 1 -or (Get-FileHash "$($backup[0].FullName)\StoryWorkbench.exe" -Algorithm SHA256).Hash -ne $priorHash) { throw 'Previous release backup not preserved' }
          $priorVersion = (Get-Content "$($backup[0].FullName)\build-manifest.json" -Raw | ConvertFrom-Json).client_version
          $newVersion = (Get-Content "$destination\build-manifest.json" -Raw | ConvertFrom-Json).client_version
          if ($priorVersion -ne '0.2.4' -or $newVersion -ne '0.2.5') { throw 'Cross-version upgrade mismatch' }
          @{ok=$true; previous_version=$priorVersion; installed_version=$newVersion; old_host_preserved=$true} | ConvertTo-Json | Set-Content dist/windows-previous-upgrade.json
          & "$destination\runtime\python.exe" -I -B "$destination\Scripts\story.py" --version
          if ($LASTEXITCODE -ne 0) { throw "Installed backend failed" }
          & "$destination\runtime\python.exe" -I -B tests/desktop_payload_probe.py --scripts "$destination\Scripts" --area "$env:RUNNER_TEMP\desktop-payload-safety" --report "$pwd\dist\windows-runtime-safety.json"
          if ($LASTEXITCODE -ne 0) { throw "Installed book management and backup probe failed" }
          $state = "$env:RUNNER_TEMP\desktop-isolated-shelf"
          $report = "$pwd\dist\windows-native-smoke.json"
          $ui = Start-Process -FilePath "$destination\StoryWorkbench.exe" -ArgumentList @('--self-test-report', "`"$report`"", '--state-dir', "`"$state`"", '--port', '18765') -PassThru
          $nativeFailure = $null
          try {
            if (!$ui.WaitForExit(180000)) { $ui.Kill(); throw "Native window startup timed out" }
            if (Test-Path $report) { Get-Content $report -Raw }
            if ($ui.ExitCode -ne 0) { throw "Native window failed: $($ui.ExitCode)" }
            $result = Get-Content $report -Raw | ConvertFrom-Json
            if (!$result.ok -or !$result.native_window -or !$result.shelf_rendered -or !$result.captured -or !$result.themes_verified -or !$result.update_check_available -or !$result.update_progress_verified -or !$result.in_private -or $result.ui_stack -ne 'wpf-webview2' -or !$result.native_close_probe_verified -or !$result.hidden_buffers_verified -or !$result.ime_guard_verified -or !$result.buffer_export_verified) { throw "Native window theme/update progress checks failed" }
          } catch {
            $nativeFailure = $_.Exception.Message
            Write-Output "Native window acceptance failed: $nativeFailure"
          } finally {
            & "$destination\runtime\python.exe" -I -B "$destination\Scripts\story.py" workbench-library-stop --state-dir "$state" --saved
            if ($LASTEXITCODE -ne 0) { throw "Isolated bookshelf cleanup failed" }
          }
          python -B -X utf8 tests/desktop_installation_probe.py --app "$destination" --installer "$($installer.FullName)" --failure-installer "$env:RUNNER_TEMP\story-workbench-lifecycle-failure-probe.exe" --area "$env:RUNNER_TEMP\installation-lifecycle-probe" --report "$pwd\dist\windows-installation-lifecycle.json"
          if ($LASTEXITCODE -ne 0) { throw "Native installation lifecycle probe failed" }
          if ($nativeFailure) { throw $nativeFailure }
          python -B scripts/check_forbidden_technologies.py --root "$destination"
          if ($LASTEXITCODE -ne 0) { throw "Installed payload contains prohibited technology" }
          python -B -X utf8 scripts/publish_windows_draft.py --artifact-root dist --verify-only --installed-root "$destination" --receipt dist/windows-distribution-verification.json
          if ($LASTEXITCODE -ne 0) { throw "Full Windows distribution verification failed" }
          $uninstall = Start-Process -FilePath "$destination\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed" }
          if ((Test-Path "$destination\StoryWorkbench.exe") -or (Test-Path "$destination\runtime\python.exe")) { throw "Installed payload survived uninstall" }
          python -B -c "import importlib.util; from pathlib import Path; s=importlib.util.spec_from_file_location('lifecycle','desktop/windows/installation_lifecycle.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert not m.processes_in(Path(r'$destination'))"
          if ($LASTEXITCODE -ne 0) { throw "Installed processes survived uninstall" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: story-workbench-0.2.5-windows-x86_64-installer
          compression-level: 0
          path: |
            dist/story-workbench-*-windows-x86_64-setup.exe
            dist/story-workbench-*-windows-x86_64-setup.exe.sha256
            dist/windows-csharp-tests.json
            dist/windows-native-smoke.json
            dist/windows-runtime-safety.json
            dist/windows-installation-lifecycle.json
            dist/windows-previous-upgrade.json
            dist/windows-native-smoke*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: story-workbench-0.2.5-windows-x86_64-portable
          compression-level: 0
          path: |
            dist/story-workbench-windows-x86_64.zip
            dist/story-workbench-windows-x86_64.zip.sha256
          if-no-files-found: error
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: story-workbench-0.2.5-windows-build-diagnostic
          path: |
            dist/windows-build-diagnostic.json
            dist/windows-installation-lifecycle.json
            dist/windows-previous-upgrade.json
            dist/windows-native-smoke.json
            dist/windows-install.log
            ${{ runner.temp }}/installation-lifecycle-probe/*.log
            dist/windows-native-smoke*.png
            dist/windows-csharp-tests.json
          if-no-files-found: warn
      - name: Preserve standalone distribution verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: story-workbench-0.2.5-windows-x86_64-verification
          path: |
            dist/windows-install.log
            dist/windows-distribution-verification.json
            dist/windows-build-manifest.json
            dist/windows-csharp-tests.json
            dist/windows-native-smoke.json
            dist/windows-runtime-safety.json
            dist/windows-installation-lifecycle.json
            dist/windows-previous-upgrade.json
            dist/windows-native-smoke*.png
          if-no-files-found: error

  publish-draft:
    needs: windows
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'NingCui29/story-skill' &&
      fromJSON(inputs.draft_release_id) > 0
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Download this run's verified Windows artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" --repo NingCui29/story-skill --name story-workbench-0.2.5-windows-x86_64-installer --dir downloaded/installer
          if ($LASTEXITCODE -ne 0) { throw "Installer artifact download failed" }
          gh run download "${{ github.run_id }}" --repo NingCui29/story-skill --name story-workbench-0.2.5-windows-x86_64-portable --dir downloaded/portable
          if ($LASTEXITCODE -ne 0) { throw "Portable artifact download failed" }
      - name: Upload only to the specified matching draft
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
        run: |
          python -B -X utf8 scripts/publish_windows_draft.py --artifact-root downloaded --release-id "$env:DRAFT_RELEASE_ID" --receipt windows-draft-upload.json
          if ($LASTEXITCODE -ne 0) { throw "Verified draft asset upload failed" }
      - name: Preserve draft upload receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: story-workbench-0.2.5-windows-draft-upload
          path: windows-draft-upload.json
          if-no-files-found: warn
