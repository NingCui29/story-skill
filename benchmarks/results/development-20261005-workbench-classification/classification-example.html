<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品分类展示示例（只读）</title>
<style>body{font:16px/1.7 system-ui;color:#293341;background:#f5f4ef;max-width:820px;margin:48px auto;padding:0 24px}h1{margin-bottom:4px}p{color:#596575}section{padding:22px;background:white;border:1px solid #ddd;border-radius:12px;margin:20px 0}input,button{font:inherit;padding:9px;border:1px solid #b9c1cb;border-radius:6px}input{box-sizing:border-box;width:100%;margin:8px 0}button{cursor:pointer;background:#f1f4f7}button:disabled{cursor:default;opacity:.5}.type-filters{display:flex;flex-wrap:wrap;gap:8px}.type-filters [aria-pressed="true"]{background:#e6edf4;border-color:#6c839d;color:#234d76}#filter-summary{font-size:13px;margin:12px 0}.book{padding:16px 0;border-bottom:1px solid #eee}.book strong{display:block}.genre-label{font-size:12px;color:#69727c;margin:8px 0 4px}.genre-tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}.classification-sources{font-size:13px;margin:8px 0 12px;color:#69727c}.classification-sources summary{cursor:pointer}.classification-sources p{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}.genre-tag{font-size:13px;padding:1px 8px;border-radius:4px;background:#edf3ed;color:#41644c}.genre-tag.pending{background:#f5f1e7;color:#8a6a3e}.path{font-size:13px;overflow-wrap:anywhere;color:#69727c}.error{color:#945322}#message{white-space:pre-wrap}a{color:#285781}</style></head>
<body><h1>作品分类展示示例</h1><p>虚构样本，只用于展示工作台如何区分作品类型与题材。</p><section><strong>只读示例</strong><p>可以点击类型筛选，展开目录和分类依据。本页不连接任何书库，添加与打开功能已禁用；这些书名、目录及分类均为虚构。</p></section><p id="message" role="status"></p><section><h2>我的作品</h2><div class="type-filters" role="group" aria-label="按作品类型筛选"><button id="filter-all" aria-pressed="true">全部 0</button><button id="filter-long" aria-pressed="false">长篇 0</button><button id="filter-short" aria-pressed="false">短篇 0</button><button id="filter-analysis" aria-pressed="false">作品分析 0</button></div><p id="filter-summary" role="status"></p><div id="books"></div></section><p>真实书架中的作品编辑会在新标签页打开。本页只是展示示例，不代表作品已登记、完成或上线。</p>
<script>const TOKEN="readonly-example";const $=id=>document.getElementById(id);let busy=false;
async function call(){throw Error('本页为只读展示示例，不连接作品服务。');}
function bookName(book){return typeof book.title==='string'&&book.title.trim()?book.title:'未命名作品';}
function bookKindLabel(book){if(book.kind_verified===false||book.available===false)return '类型未核对';const labels={long:'长篇',short:'短篇',analysis:'作品分析'};return Object.hasOwn(labels,book.kind)?labels[book.kind]:'类型未确认';}
function bookDisplayRows(books){
 const path=book=>typeof book.root==='string'?book.root.replace(/\\/g,'/').replace(/\/+$/,'')||'/':'';
 const parts=book=>path(book).split('/').filter(Boolean),suffix=(book,depth)=>parts(book).slice(-depth).join('/');
 return books.map(book=>{const title=bookName(book),same=books.filter(other=>bookName(other)===title);let directory='';
  if(same.length>1){let depth=1;const maximum=parts(book).length;while(depth<maximum&&same.some(other=>path(other)!==path(book)&&suffix(other,depth)===suffix(book,depth)))depth++;
   directory=path(book)?(depth>=maximum?path(book):'…/'+suffix(book,depth)):'目录未提供';}
  return {...book,displayTitle:title,kindLabel:bookKindLabel(book),label:title+' · '+bookKindLabel(book)+(directory?' · '+directory:'')};
 });
}
function classificationNode(book){
 const box=document.createElement('div');box.className='classification';const label=document.createElement('p');label.className='genre-label';label.textContent=book.kind==='analysis'?'分析对象题材':'题材';box.append(label);
 const classification=book.classification,status=classification?.status||'missing',tags=[...new Set((Array.isArray(classification?.tags)?classification.tags:[]).filter(tag=>typeof tag==='string').map(tag=>tag.trim()).filter(Boolean))];const row=document.createElement('div');row.className='genre-tags';
 if(status==='recorded'&&tags.length){for(const text of tags){const tag=document.createElement('span');tag.className='genre-tag';tag.textContent=text;row.append(tag);}}
 else{const tag=document.createElement('span');tag.className='genre-tag pending';tag.textContent=status==='missing'||status==='recorded'?'题材待分类':'题材待核对';row.append(tag);}box.append(row);
 const sources=(Array.isArray(classification?.sources)?classification.sources:[]).filter(source=>source&&typeof source==='object'),note=typeof classification?.note==='string'?classification.note:'';
 if(sources.length||note){const details=document.createElement('details');details.className='classification-sources';const summary=document.createElement('summary');summary.textContent='分类依据';details.append(summary);for(const source of sources){const p=document.createElement('p');p.textContent=(typeof source.path==='string'?source.path:'来源未标注')+(Number.isInteger(source.line)&&source.line>0?' · 第'+source.line+'行':'')+'\n'+(typeof source.field==='string'?source.field:'字段未标注')+'：'+(typeof source.value==='string'?source.value:'原值未提供');details.append(p);}if(note){const p=document.createElement('p');p.textContent=note;details.append(p);}box.append(details);}
 return box;
}

const shelfKinds=[['all','全部'],['long','长篇'],['short','短篇'],['analysis','作品分析']];let shelfBooks=[],shelfFilter='all';
function shelfBookKind(book){return book.kind_verified!==false&&book.available!==false&&['long','short','analysis'].includes(book.kind)?book.kind:null;}
function renderShelf(){
 const visible=shelfFilter==='all'?shelfBooks:shelfBooks.filter(book=>shelfBookKind(book)===shelfFilter);
 for(const [kind,label]of shelfKinds){const count=kind==='all'?shelfBooks.length:shelfBooks.filter(book=>shelfBookKind(book)===kind).length;const button=$('filter-'+kind);button.textContent=label+' '+count;button.setAttribute('aria-pressed',String(shelfFilter===kind));}
 const label=shelfKinds.find(([kind])=>kind===shelfFilter)[1],pending=shelfBooks.filter(book=>!shelfBookKind(book)).length;
 $('filter-summary').textContent=(shelfFilter==='all'?'全部作品':label)+' · '+visible.length+' 部'+(shelfFilter==='all'&&pending?' · '+pending+' 部类型尚未确认':'');
 $('books').replaceChildren();if(!visible.length){$('books').textContent=shelfBooks.length?'当前分类暂无作品；可在“全部”查看其他作品。':'书架还是空的，请先添加一本已有作品。';return;}
 for(const b of visible){const row=document.createElement('div');row.className='book';const title=document.createElement('strong');title.textContent=b.label;const genres=classificationNode(b);const path=document.createElement('details');const summary=document.createElement('summary');summary.textContent='目录位置';const directory=document.createElement('div');directory.className='path';directory.textContent=b.root||'目录未提供';path.append(summary,directory);const open=document.createElement('button');open.textContent='打开作品';open.disabled=true;open.title='只读示例，不打开作品服务';open.onclick=async()=>{open.disabled=true;try{const r=await call('open-book',{key:b.key});const a=document.createElement('a');a.href=r.url;a.target='_blank';a.rel='noopener';a.textContent='点击打开：'+b.label;$('message').replaceChildren(a);a.click();if(r.outdated)$('message').append(document.createTextNode('（此作品服务使用较早代码，升级前请保留原页面编辑。）'));}catch(e){$('message').textContent=e.message;}finally{open.disabled=true;open.title='只读示例，不打开作品服务';}};row.append(title,genres,path,open);if(!b.available){const err=document.createElement('p');err.className='error';err.textContent=b.error||'作品暂不可用，请核对目录。';row.append(err);}$('books').append(row);}
}
function render(v){shelfBooks=bookDisplayRows(v.books);renderShelf();}
for(const [kind]of shelfKinds)$('filter-'+kind).onclick=()=>{shelfFilter=kind;renderShelf();};
async function refresh(){try{render(await call('books'));}catch(e){$('message').textContent=e.message;}}
render({"books": [{"title": "夜归账本", "kind": "long", "key": "sample-long", "root": "/示例/长篇/夜归账本", "available": true, "kind_verified": true, "classification": {"status": "recorded", "tags": ["都市", "悬疑"], "sources": [{"path": "01_策划/作品分类.md", "field": "题材", "value": "都市、悬疑", "line": 3}]}}, {"title": "夜归账本", "kind": "short", "key": "sample-short", "root": "/示例/短篇/夜归账本", "available": true, "kind_verified": true, "classification": {"status": "recorded", "tags": ["悬疑"], "sources": [{"path": "01_策划/故事策划.md", "field": "题材", "value": "悬疑", "line": 4}]}}, {"title": "仙门经营拆解", "kind": "analysis", "key": "sample-analysis", "root": "/示例/作品分析/仙门经营拆解", "available": true, "kind_verified": true, "classification": {"status": "recorded", "tags": ["修仙"], "sources": [{"path": "analysis_metadata.json", "field": "分析对象题材", "value": "修仙"}]}}, {"title": "新书待选题", "kind": "long", "key": "sample-missing", "root": "/示例/长篇/新书待选题", "available": true, "kind_verified": true, "classification": {"status": "missing", "tags": [], "sources": [], "note": "没有读取到明确登记的通用题材，需先核对规划材料。"}}, {"title": "分类待核对", "kind": "short", "key": "sample-review", "root": "/示例/短篇/分类待核对", "available": true, "kind_verified": true, "classification": {"status": "needs_review", "tags": [], "sources": [{"path": "01_策划/旧策划.md", "field": "题材", "value": "都市", "line": 3}, {"path": "01_策划/新策划.md", "field": "题材", "value": "修仙", "line": 5}], "note": "两份材料的题材记录不同，尚未确认当前采用哪一份。"}}, {"title": "目录待核对", "kind": "long", "key": "sample-unavailable", "root": "/示例/待核对/目录待核对", "available": false, "kind_verified": false, "error": "示例：原登记目录暂不可用，请核对目录与作品身份。", "classification": {"status": "unavailable", "tags": [], "sources": [], "note": "暂时无法核对原作品的分类材料。"}}]});</script></body></html>
